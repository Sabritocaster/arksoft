services:
  storionx-mock:
    build:
      context: .
      dockerfile: backend/src/StorionX.MockApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - backend

  demo-api:
    build:
      context: .
      dockerfile: backend/src/EvMigration.DemoApi/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Demo__DataRoot: /data
      Demo__MappingPath: /app/samples/target-archives.json
      Demo__StorionXUrl: http://storionx-mock:8080
    volumes:
      - demo-data:/data
    expose:
      - "8080"
    depends_on:
      storionx-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - backend

  gateway:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      demo-api:
        condition: service_healthy
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    networks:
      - edge
      - backend

volumes:
  demo-data:
  caddy-data:
  caddy-config:

networks:
  edge:
  backend:
    internal: true
